services:
  # ── Infrastructure ──────────────────────────────────────────────────────

  db:
    build: ./dvdrental_db
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    command: postgres -c shared_preload_libraries=pg_stat_statements
    volumes:
      - dvdrental_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d dvdrental"]
      interval: 5s
      timeout: 5s
      retries: 10

  pghero:
    image: ankane/pghero:v4.0.1
    ports:
      - "127.0.0.1:${PGHERO_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/dvdrental
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.18
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8082}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:6.1.1
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy


volumes:
  dvdrental_data:
